name: Build Linux Desktop App

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'jetbrains'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.14.3

    - name: Install Linux packaging tools
      run: |
        sudo apt-get update
        sudo apt-get install -y rpm fakeroot
        # rpmrebuild нужен для патча .rpm; не критично, если недоступен — rpm-шаг это учитывает
        sudo apt-get install -y rpmrebuild || echo "::warning::rpmrebuild не установился — .rpm не будет патчиться"

    - name: Build Linux App
      working-directory: ./mobile_app_client
      run: ./gradlew :composeApp:createDistributable

    - name: Build Linux DEB
      working-directory: ./mobile_app_client
      run: ./gradlew :composeApp:packageDeb

    - name: Build Linux RPM
      working-directory: ./mobile_app_client
      run: ./gradlew :composeApp:packageRpm

    # jpackage не пишет StartupWMClass в .desktop → на Wayland (Niri/GNOME/KDE) Dock не
    # сопоставляет окно (app_id ru-homebudget-finkeeper-MainKt) с ярлыком: дефолтная иконка
    # и кривое имя. Дописываем строку прямо в собранные пакеты.
    # БЕЗОПАСНОСТЬ: любая ошибка патча → восстанавливаем оригинальный (рабочий) пакет,
    # сборку не роняем. .deb патчится надёжно (dpkg-deb), .rpm — best-effort (rpmrebuild).
    - name: Add StartupWMClass to .desktop (Wayland Dock fix)
      working-directory: ./mobile_app_client/composeApp/build/compose/binaries/main
      run: |
        set -u
        WMCLASS='ru-homebudget-finkeeper-MainKt'

        # ---------- .deb ----------
        deb="$(ls deb/*.deb 2>/dev/null | head -n1 || true)"
        if [ -n "${deb:-}" ]; then
          cp "$deb" "$deb.orig"
          if (
                set -e
                ext="$(mktemp -d)"
                dpkg-deb -R "$deb" "$ext"
                d="$(find "$ext/opt/finkeeper24/lib" -maxdepth 1 -name '*.desktop' | head -n1)"
                [ -n "$d" ]
                grep -q '^StartupWMClass=' "$d" || printf 'StartupWMClass=%s\n' "$WMCLASS" >> "$d"
                # --root-owner-group обязателен: иначе файлы в пакете будут от uid раннера, не root
                dpkg-deb --root-owner-group -b "$ext" "$deb" >/dev/null
                v="$(mktemp -d)"; dpkg-deb -x "$deb" "$v"
                grep -rq "^StartupWMClass=$WMCLASS" "$v/opt/finkeeper24/lib"
             ); then
            rm -f "$deb.orig"; echo "::notice::DEB: StartupWMClass добавлен"
          else
            mv -f "$deb.orig" "$deb"; echo "::warning::DEB-патч не удался — залит оригинальный пакет"
          fi
        fi

        # ---------- .rpm (best-effort) ----------
        rpm="$(ls rpm/*.rpm 2>/dev/null | head -n1 || true)"
        if [ -n "${rpm:-}" ]; then
          if ! command -v rpmrebuild >/dev/null; then
            echo "::warning::RPM: rpmrebuild недоступен — пакет оставлен как есть"
          else
            cp "$rpm" "$rpm.orig"
            if (
                  set -e
                  timeout 600 rpmrebuild --batch \
                    --change-files='f="$(find ./opt/finkeeper24/lib -maxdepth 1 -name "*.desktop" | head -n1)"; grep -q "^StartupWMClass=" "$f" || printf "StartupWMClass=ru-homebudget-finkeeper-MainKt\n" >> "$f"' \
                    -p "$rpm"
                  out="$(find "$HOME/rpmbuild/RPMS" -name '*.rpm' 2>/dev/null | head -n1)"
                  [ -n "$out" ]
                  # проверка через файл (не пайп в grep -q) — иначе pipefail+SIGPIPE даст ложный сбой
                  chk="$(mktemp)"
                  rpm2cpio "$out" | cpio -i --quiet --to-stdout './opt/finkeeper24/lib/finkeeper24-FinKeeper24.desktop' > "$chk" 2>/dev/null
                  grep -q "^StartupWMClass=$WMCLASS" "$chk"
                  cp -f "$out" "$rpm"
               ); then
            rm -f "$rpm.orig"; echo "::notice::RPM: StartupWMClass добавлен"
          else
            mv -f "$rpm.orig" "$rpm"; echo "::warning::RPM-патч не удался — залит оригинальный пакет"
          fi
          fi
        fi

    - name: Upload Linux DEB
      uses: actions/upload-artifact@v4
      with:
        name: FinKeeper-Linux-DEB
        path: mobile_app_client/composeApp/build/compose/binaries/main/deb/*.deb
        retention-days: 3

    - name: Upload Linux RPM
      uses: actions/upload-artifact@v4
      with:
        name: FinKeeper-Linux-RPM
        path: mobile_app_client/composeApp/build/compose/binaries/main/rpm/*.rpm
        retention-days: 3
