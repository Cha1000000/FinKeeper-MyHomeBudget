name: Build macOS Desktop App

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'jetbrains'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.14.3

    - name: Build macOS App
      working-directory: ./mobile_app_client
      run: ./gradlew :composeApp:packageDistributionForCurrentOS

    - name: Upload macOS App
      uses: actions/upload-artifact@v4
      with:
        name: FinKeeper-macOS
        path: mobile_app_client/composeApp/build/compose/binaries/main/app/FinKeeper.app
        retention-days: 3

    - name: Upload macOS DMG
      uses: actions/upload-artifact@v4
      with:
        name: FinKeeper-macOS-DMG
        path: mobile_app_client/composeApp/build/compose/binaries/main/dmg/*.dmg
        retention-days: 3

    - name: Upload macOS PKG
      uses: actions/upload-artifact@v4
      with:
        name: FinKeeper-macOS-PKG
        path: mobile_app_client/composeApp/build/compose/binaries/main/pkg/*.pkg
        retention-days: 3
