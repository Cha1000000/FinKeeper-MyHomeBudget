        }
    }

    sourceSets {
        commonMain {
            dependencies {
                implementation compose.runtime
                implementation compose.foundation
                implementation compose.material3
                implementation compose.materialIconsExtended
                implementation compose.ui
                implementation compose.components.resources
                implementation compose.components.uiToolingPreview

                implementation libs.ktor.client.core
                implementation libs.ktor.client.content.negotiation
                implementation libs.ktor.serialization.kotlinx.json
                implementation libs.ktor.client.auth
                implementation libs.ktor.client.logging
                implementation libs.ktor.client.websockets

                implementation libs.kotlinx.serialization.json
                implementation libs.kotlinx.coroutines.core
                implementation libs.kotlinx.datetime

                implementation libs.multiplatform.settings.asProvider()

                implementation libs.koin.core
                implementation libs.koin.compose

                implementation libs.sqldelight.runtime
                implementation libs.sqldelight.coroutines
                implementation libs.sqldelight.primitive.adapters

                implementation libs.jetbrains.lifecycle.viewmodel.asProvider()
                implementation libs.jetbrains.lifecycle.viewmodel.compose

                implementation libs.reorderable
            }
        }
        androidMain {
            dependencies {
                implementation libs.androidx.activity.compose
                implementation libs.androidx.security.crypto
                implementation libs.androidx.compose.ui.tooling.preview
                implementation libs.ktor.client.okhttp
                implementation libs.koin.android
                implementation libs.sqldelight.android
                implementation libs.androidx.lifecycle.viewmodel.compose
                implementation libs.androidx.lifecycle.runtime.compose

                // RuStore In-app Update SDK (оповещение о новой версии в RuStore)
                implementation libs.rustore.appupdate
            }
        }
        iosMain {
            dependencies {
                implementation libs.ktor.client.darwin
                implementation libs.sqldelight.native
            }
        }
        desktopMain {
            dependencies {
                implementation compose.desktop.currentOs
                implementation libs.credential.secure.storage
                implementation libs.ktor.client.cio
                implementation libs.kotlinx.coroutines.swing
                implementation libs.sqldelight.sqlite
            }
        }
        desktopTest {
            dependencies {
                implementation libs.kotlin.test
                implementation libs.sqldelight.sqlite
            }
        }
        commonTest {
            dependencies {
                implementation libs.kotlin.test
                implementation libs.kotlinx.coroutines.test
                implementation libs.kotlinx.serialization.json
                implementation libs.kotlinx.datetime
                implementation libs.multiplatform.settings.test
            }
