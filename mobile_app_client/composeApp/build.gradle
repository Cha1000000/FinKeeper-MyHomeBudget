buildscript {
    ext {
        kotlin_version = '2.2.10'
        compose_version = '1.6.10'
        ktor_version = '3.0.1'
        kotlinx_serialization_version = '1.7.1'
        kotlinx_coroutines_version = '1.8.1'
        kotlinx_datetime_version = '0.6.0'
        multiplatform_settings_version = '1.1.1'
        koin_version = '3.5.6'
        sqldelight_version = '2.0.2'
        app_version = '2.0.0'
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.compose:compose-gradle-plugin:$compose_version"
        classpath "app.cash.sqldelight:gradle-plugin:$sqldelight_version"
    }
}

plugins {
    id 'org.jetbrains.kotlin.multiplatform' version '2.2.10'
    id 'com.android.application'
    id 'org.jetbrains.compose'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.10'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.2.10'
    id 'app.cash.sqldelight' version '2.0.2'
}

sqldelight {
    databases {
        FinKeeperDatabase {
            packageName.set('ru.homebudget.finkeeper.data.local.database')
            linkSqlite.set(true)
        }
    }
}

kotlin {
    androidTarget {
        compilations.all {
            kotlinOptions {
                jvmTarget = '11'
            }
        }
    }

    jvm("desktop") {
        compilations.all {
            kotlinOptions {
                jvmTarget = '17'
            }
        }
    }

    [iosArm64(), iosSimulatorArm64()].each { iosTarget ->
        iosTarget.binaries.framework {
            baseName = "ComposeApp"
            isStatic = true
        }
    }

    sourceSets {
        commonMain {
            dependencies {
                implementation compose.runtime
                implementation compose.foundation
                implementation compose.material3
                implementation compose.materialIconsExtended
                implementation compose.ui
                implementation compose.components.resources
                implementation compose.components.uiToolingPreview

                // Ktor
                implementation "io.ktor:ktor-client-core:$ktor_version"
                implementation "io.ktor:ktor-client-content-negotiation:$ktor_version"
                implementation "io.ktor:ktor-serialization-kotlinx-json:$ktor_version"
                implementation "io.ktor:ktor-client-auth:$ktor_version"
                implementation "io.ktor:ktor-client-logging:$ktor_version"
                implementation "io.ktor:ktor-client-websockets:$ktor_version"

                // Kotlinx
                implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$kotlinx_serialization_version"
                implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlinx_coroutines_version"
                implementation "org.jetbrains.kotlinx:kotlinx-datetime:$kotlinx_datetime_version"

                // Multiplatform Settings
                implementation "com.russhwolf:multiplatform-settings-no-arg:$multiplatform_settings_version"

                // Koin - core and compose for multiplatform
                implementation "io.insert-koin:koin-core:$koin_version"
                implementation "io.insert-koin:koin-compose:1.2.0-Beta4"

                // SQLDelight
                implementation "app.cash.sqldelight:runtime:$sqldelight_version"
                implementation "app.cash.sqldelight:coroutines-extensions:$sqldelight_version"
                implementation "app.cash.sqldelight:primitive-adapters:$sqldelight_version"

                // Lifecycle ViewModel for commonMain (multiplatform)
                implementation "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel:2.8.0"
                implementation "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0"

                // Reorderable
                implementation "sh.calvin.reorderable:reorderable:2.3.3"
            }
        }
        androidMain {
            dependencies {
                implementation 'androidx.activity:activity-compose:1.9.0'
                implementation 'androidx.security:security-crypto-ktx:1.1.0-alpha06'
                implementation 'androidx.compose.ui:ui-tooling-preview:1.6.8'
                implementation "io.ktor:ktor-client-okhttp:$ktor_version"
                implementation "io.insert-koin:koin-android:$koin_version"
                implementation "io.insert-koin:koin-androidx-compose:$koin_version"
                implementation "app.cash.sqldelight:android-driver:$sqldelight_version"
                implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'
                implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.3'
            }
        }
        iosMain {
            dependencies {
                implementation "io.ktor:ktor-client-darwin:$ktor_version"
                implementation "io.insert-koin:koin-core:$koin_version"
                implementation "app.cash.sqldelight:native-driver:$sqldelight_version"
                implementation "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel:2.8.0"
            }
        }
        desktopMain {
            dependencies {
                implementation compose.desktop.currentOs
                implementation "com.microsoft:credential-secure-storage:1.0.0"
                implementation "io.ktor:ktor-client-cio:$ktor_version"
                implementation "org.jetbrains.kotlinx:kotlinx-coroutines-swing:$kotlinx_coroutines_version"
                implementation "io.insert-koin:koin-core:$koin_version"
                implementation "io.insert-koin:koin-compose:1.2.0-alpha3"
                implementation "app.cash.sqldelight:sqlite-driver:$sqldelight_version"
                // Lifecycle for desktop
                implementation "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose:2.8.0"
            }
        }
        desktopTest {
            dependencies {
                implementation 'org.jetbrains.kotlin:kotlin-test'
                implementation "app.cash.sqldelight:sqlite-driver:$sqldelight_version"
            }
        }
        commonTest {
            dependencies {
                implementation 'org.jetbrains.kotlin:kotlin-test'
                implementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$kotlinx_coroutines_version"
                implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$kotlinx_serialization_version"
                implementation "org.jetbrains.kotlinx:kotlinx-datetime:$kotlinx_datetime_version"
                implementation "com.russhwolf:multiplatform-settings-test:$multiplatform_settings_version"
            }
        }
    }
}

android {
    namespace 'ru.homebudget.finkeeper'
    compileSdk = 35

    defaultConfig {
        applicationId "ru.homebudget.finkeeper"
        minSdk = 24
        targetSdk = 35
        versionCode = 1
        versionName = app_version
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            def keystoreProperties = new Properties()
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
            storeFile = file(keystoreProperties.getProperty("storeFile", "../release-keystore.jks"))
            storePassword keystoreProperties.getProperty("storePassword", "")
            keyAlias keystoreProperties.getProperty("keyAlias", "")
            keyPassword keystoreProperties.getProperty("keyPassword", "")
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def outputFile = output.outputFileName
            output.outputFileName = "FinKeeper24-mobileApp-v${versionName}-${variant.name}.apk"
        }
    }
}

// Compose Desktop packaging configuration
// Generate BuildConfig with app version for commonMain
def generatedDir = layout.buildDirectory.dir("generated/buildconfig/commonMain/kotlin")
def appVersionStr = app_version
def requestedTaskNames = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def isReleaseLikeBuild = requestedTaskNames.any {
    it.contains("release") || it.contains("package") || it.contains("distribut") || it.contains("publish")
}
def buildConfigDefaultServerUrlProvider = providers
    .gradleProperty("DEFAULT_SERVER_URL")
    .orElse(providers.environmentVariable("DEFAULT_SERVER_URL"))
def buildConfigShowServerSettingsProvider = providers
    .gradleProperty("SHOW_SERVER_SETTINGS")
    .orElse(providers.environmentVariable("SHOW_SERVER_SETTINGS"))
def defaultServerUrlStr = buildConfigDefaultServerUrlProvider.getOrElse("https://app.finkeeper24.ru").trim()
def showServerSettingsStr = buildConfigShowServerSettingsProvider.getOrElse((!isReleaseLikeBuild).toString())

tasks.register('generateBuildConfig') {
    def outputDir = generatedDir
    def version = appVersionStr
    def defaultServerUrl = defaultServerUrlStr.endsWith("/") ? defaultServerUrlStr[0..-2] : defaultServerUrlStr
    def showServerSettings = showServerSettingsStr.toBoolean()
    inputs.property("buildConfigVersion", version)
    inputs.property("buildConfigDefaultServerUrl", defaultServerUrl)
    inputs.property("buildConfigShowServerSettings", showServerSettings)
    outputs.dir(outputDir)
    doLast {
        def dir = new File(outputDir.get().asFile, "ru/homebudget/finkeeper")
        dir.mkdirs()
        new File(dir, "BuildConfig.kt").text = """\
package ru.homebudget.finkeeper

object BuildConfig {
    const val APP_VERSION = "v${version}"
    const val DEFAULT_SERVER_URL = "${defaultServerUrl}"
    const val SHOW_SERVER_SETTINGS = ${showServerSettings}
}
"""
    }
}

kotlin.sourceSets.commonMain {
    kotlin.srcDir(generatedDir)
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    dependsOn("generateBuildConfig")
}

// Also ensure generateBuildConfig runs before Android compilation
tasks.matching { it.name.contains("compile") && it.name.contains("Kotlin") }.configureEach {
    dependsOn("generateBuildConfig")
}

compose.desktop {
    application {
        mainClass = "ru.homebudget.finkeeper.MainKt"

        javaHome = providers.environmentVariable("COMPOSE_JDK").orElse(
            providers.environmentVariable("JAVA_HOME")
        ).orElse(
            provider {
                def proc = ["bash", "-c", "/usr/libexec/java_home 2>/dev/null || echo ''"].execute()
                proc.waitFor()
                proc.text.trim() ?: null
            }
        ).orNull

        nativeDistributions {
            targetFormats(
                org.jetbrains.compose.desktop.application.dsl.TargetFormat.Dmg,
                org.jetbrains.compose.desktop.application.dsl.TargetFormat.Pkg,
                org.jetbrains.compose.desktop.application.dsl.TargetFormat.Msi,
                org.jetbrains.compose.desktop.application.dsl.TargetFormat.Exe,
                org.jetbrains.compose.desktop.application.dsl.TargetFormat.Deb,
                org.jetbrains.compose.desktop.application.dsl.TargetFormat.Rpm
            )

            modules("java.instrument", "java.management", "java.prefs", "java.sql", "jdk.unsupported")

            packageName = "FinKeeper24"
            packageVersion = app_version

            macOS {
                iconFile.set(project.file("src/desktopMain/resources/icon.icns"))
                bundleID = "ru.homebudget.finkeeper"
                packageName = "FinKeeper24"
                dockName = "FinKeeper24"
            }

            windows {
                iconFile.set(project.file("src/desktopMain/resources/icon.ico"))
                packageName = "FinKeeper24"
                description = "FinKeeper24 - Personal Finance Manager"
                vendor = "HomeBudget"
                shortcut = true
                menuGroup = "FinKeeper24"
                upgradeUuid = "A1B2C3D4-E5F6-7890-ABCD-EF1234567890"
            }

            linux {
                iconFile.set(project.file("src/desktopMain/resources/icon.png"))
                packageName = "FinKeeper24"
                debMaintainer = "finkeeper@homebudget.ru"
                appCategory = "Office"
            }
        }
    }
}
