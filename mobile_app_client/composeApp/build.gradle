}

android {
    namespace 'ru.homebudget.finkeeper'
    compileSdk = libs.versions.android.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "ru.homebudget.finkeeper"
        minSdk = libs.versions.android.minSdk.get().toInteger()
        targetSdk = libs.versions.android.targetSdk.get().toInteger()
        versionCode = 10
        versionName = app_version
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            def keystoreProperties = new Properties()
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
            storeFile = file(keystoreProperties.getProperty("storeFile", "../release-keystore.jks"))
            storePassword keystoreProperties.getProperty("storePassword", "")
            keyAlias keystoreProperties.getProperty("keyAlias", "")
            keyPassword keystoreProperties.getProperty("keyPassword", "")
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def outputFile = output.outputFileName
            output.outputFileName = "FinKeeper24-mobileApp-v${versionName}-${variant.name}.apk"
        }
    }
}

// Compose Desktop packaging configuration
// Generate BuildConfig with app version for commonMain
def generatedDir = layout.buildDirectory.dir("generated/buildconfig/commonMain/kotlin")
def appVersionStr = app_version
def requestedTaskNames = gradle.startParameter.taskNames.collect { it.toLowerCase() }
def isReleaseLikeBuild = requestedTaskNames.any {
    it.contains("release") || it.contains("package") || it.contains("distribut") || it.contains("publish")
}
def buildConfigDefaultServerUrlProvider = providers
    .gradleProperty("DEFAULT_SERVER_URL")
    .orElse(providers.environmentVariable("DEFAULT_SERVER_URL"))
def buildConfigShowServerSettingsProvider = providers
    .gradleProperty("SHOW_SERVER_SETTINGS")
    .orElse(providers.environmentVariable("SHOW_SERVER_SETTINGS"))
def defaultServerUrlStr = buildConfigDefaultServerUrlProvider.getOrElse("https://app.finkeeper24.ru").trim()
def showServerSettingsStr = buildConfigShowServerSettingsProvider.getOrElse((!isReleaseLikeBuild).toString())

tasks.register('generateBuildConfig') {
    def outputDir = generatedDir
    def version = appVersionStr
    def defaultServerUrl = defaultServerUrlStr.endsWith("/") ? defaultServerUrlStr[0..-2] : defaultServerUrlStr
    def showServerSettings = showServerSettingsStr.toBoolean()
    inputs.property("buildConfigVersion", version)
    inputs.property("buildConfigDefaultServerUrl", defaultServerUrl)
    inputs.property("buildConfigShowServerSettings", showServerSettings)
    outputs.dir(outputDir)
    doLast {
        def dir = new File(outputDir.get().asFile, "ru/homebudget/finkeeper")
        dir.mkdirs()
        new File(dir, "BuildConfig.kt").text = """\
package ru.homebudget.finkeeper

object BuildConfig {
    const val APP_VERSION = "v${version}"
    const val DEFAULT_SERVER_URL = "${defaultServerUrl}"
    const val SHOW_SERVER_SETTINGS = ${showServerSettings}
}
"""
    }
}

kotlin.sourceSets.commonMain {
    kotlin.srcDir(generatedDir)
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    dependsOn("generateBuildConfig")
}

// Also ensure generateBuildConfig runs before Android compilation
tasks.matching { it.name.contains("compile") && it.name.contains("Kotlin") }.configureEach {
    dependsOn("generateBuildConfig")
}

compose.desktop {
    application {
        mainClass = "ru.homebudget.finkeeper.MainKt"

        def resolvedJavaHome = providers.environmentVariable("COMPOSE_JDK").orElse(
            providers.environmentVariable("JAVA_HOME")
        ).orNull
        if (resolvedJavaHome != null) {
            javaHome = resolvedJavaHome
        }

        // На Linux форсируем софтверный рендер Skiko: дефолтный OpenGL-бэкенд
        // даёт чёрное окно на NVIDIA под Wayland/XWayland (Niri и др. композиторы).
        // Скорость для этого приложения некритична, зато окно гарантированно рисуется.
        if (System.getProperty("os.name")?.toLowerCase()?.contains("linux")) {
            jvmArgs.add("-Dskiko.renderApi=SOFTWARE")
        }

        // Dev-изоляция: FINKEEPER_USER_HOME подменяет user.home ТОЛЬКО для JVM приложения
        // (локальная БД ~/.finkeeper и Java Preferences уедут в песочницу) — чтобы
        // тестовые запуски `:composeApp:run` не трогали реальные данные пользователя
        def devUserHome = providers.environmentVariable("FINKEEPER_USER_HOME").orNull
        if (devUserHome) {
            jvmArgs.add("-Duser.home=" + devUserHome)
        }

        nativeDistributions {
            targetFormats(
                org.jetbrains.compose.desktop.application.dsl.TargetFormat.Dmg,
                org.jetbrains.compose.desktop.application.dsl.TargetFormat.Pkg,
                org.jetbrains.compose.desktop.application.dsl.TargetFormat.Msi,
                org.jetbrains.compose.desktop.application.dsl.TargetFormat.Exe,
                org.jetbrains.compose.desktop.application.dsl.TargetFormat.Deb,
                org.jetbrains.compose.desktop.application.dsl.TargetFormat.Rpm
            )

            modules("java.instrument", "java.management", "java.prefs", "java.sql", "jdk.unsupported")

            packageName = "FinKeeper24"
            packageVersion = app_version

            macOS {
                iconFile.set(project.file("src/desktopMain/resources/icon.icns"))
                bundleID = "ru.homebudget.finkeeper"
                packageName = "FinKeeper24"
                dockName = "FinKeeper24"
            }

            windows {
                iconFile.set(project.file("src/desktopMain/resources/icon.ico"))
                packageName = "FinKeeper24"
                description = "FinKeeper24 - Personal Finance Manager"
                vendor = "HomeBudget"
                shortcut = true
                menuGroup = "FinKeeper24"
                upgradeUuid = "A1B2C3D4-E5F6-7890-ABCD-EF1234567890"
            }

            linux {
                iconFile.set(project.file("src/desktopMain/resources/icon.png"))
                packageName = "finkeeper24"
                debMaintainer = "finkeeper@homebudget.ru"
                appCategory = "Office"
            }
        }
    }
}
